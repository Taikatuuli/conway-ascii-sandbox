<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke — Language Learning</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --text: #e8e8e8;
      --text-muted: #8b8b8b;
      --text-dim: rgba(232, 232, 232, 0.35);
      --text-upcoming: rgba(232, 232, 232, 0.6);
      --accent: #4ade80;
      --phonetic: #5a9fd4;
      --border: #222;
      --surface: #141414;
      --surface2: #1a1a1a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #app { height: 100%; }

    /* Screen visibility */
    .screen { display: none; height: 100%; }
    .screen.active { display: flex; }

    /* Utility */
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button.primary { background: var(--accent); color: #000; font-weight: 600; }
    button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    input, textarea, select {
      font-family: inherit;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface); }
  </style>
</head>
<body>
<div id="app">

  <div id="screen-input" class="screen active">
    <!-- Task 2 -->
  </div>

  <div id="screen-loading" class="screen">
    <!-- Task 3 -->
  </div>

  <div id="screen-player" class="screen">
    <!-- Task 4/5 -->
  </div>

  <div id="modal-recap">
    <!-- Task 8 -->
  </div>

  <div id="tooltip" role="tooltip">
    <!-- Task 7 -->
  </div>

</div>
<script>
// ── APP STATE ─────────────────────────────────────────────────────────────────
const APP = {
  apiKey: null,
  lyrics: [],          // [{original, translation, phonetic, keywords:[{word,meaning}]}]
  timestamps: [],      // [seconds per line]
  currentLine: -1,
  language: '',
  player: null,
  pollInterval: null,
  durationRetries: 0,
};

// ── SCREEN TRANSITIONS ────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
