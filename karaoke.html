<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke — Language Learning</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --text: #e8e8e8;
      --text-muted: #8b8b8b;
      --text-dim: rgba(232, 232, 232, 0.35);
      --text-upcoming: rgba(232, 232, 232, 0.6);
      --accent: #4ade80;
      --phonetic: #5a9fd4;
      --border: #222;
      --surface: #141414;
      --surface2: #1a1a1a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #app { height: 100%; }

    /* Screen visibility */
    .screen { display: none; height: 100%; }
    .screen.active { display: flex; }

    /* Utility */
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button.primary { background: var(--accent); color: #000; font-weight: 600; }
    button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    input, textarea, select {
      font-family: inherit;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface); }

    /* Input screen */
    #screen-input { align-items: center; justify-content: center; padding: 32px 16px; overflow-y: auto; }

    .input-wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .app-title span { color: var(--accent); }

    .app-subtitle { color: var(--text-muted); font-size: 14px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .field-hint { font-size: 12px; color: var(--text-muted); }

    textarea { resize: vertical; min-height: 140px; line-height: 1.5; }

    #btn-start { align-self: flex-start; padding: 12px 28px; font-size: 15px; }

    .inline-error {
      font-size: 13px;
      color: #f87171;
      padding: 8px 12px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 6px;
    }

    /* Loading screen */
    #screen-loading { align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center; }

    .loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }

    #loading-msg { font-size: 18px; font-weight: 600; }
    #loading-sub { font-size: 13px; color: var(--text-muted); }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Player screen */
    #screen-player {
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }

    .player-col {
      flex: 0 0 55%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #yt-player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    #yt-player-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }

    .lyrics-col {
      flex: 1;
      overflow-y: auto;
      padding: 40px 28px;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }

    /* Lyric lines */
    .lyric-line {
      padding: 20px 16px 20px 20px;
      border-left: 4px solid transparent;
      transition: border-color 0.3s, opacity 0.3s;
      cursor: default;
      border-radius: 0 6px 6px 0;
    }

    .lyric-line.past { opacity: 0.35; }

    .lyric-line.upcoming { opacity: 0.6; }

    .lyric-line.current {
      opacity: 1;
      border-left-color: var(--accent);
      background: rgba(74, 222, 128, 0.04);
    }

    .lyric-original {
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.4;
      margin-bottom: 4px;
      color: var(--text);
      transition: font-size 0.3s, font-weight 0.3s;
    }

    .lyric-line.current .lyric-original {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }

    .lyric-phonetic {
      font-size: 0.8rem;
      color: var(--phonetic);
      margin-bottom: 3px;
      line-height: 1.4;
    }

    .lyric-translation {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.4;
    }

    /* Word spans (tap-to-translate) */
    .word {
      display: inline;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.1s;
    }
    .word:hover { background: rgba(74, 222, 128, 0.15); }

    /* Tooltip */
    #tooltip {
      position: fixed;
      z-index: 100;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      pointer-events: none;
      max-width: 240px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .tooltip-word {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 3px;
    }
    .tooltip-meaning {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Recap modal */
    #modal-recap {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 24px;
    }

    .recap-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .recap-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .recap-card h2 span { color: var(--accent); }

    .recap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .recap-kw {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .recap-kw-word { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .recap-kw-meaning { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

    .recap-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* Mobile */
    @media (max-width: 767px) {
      #screen-player { flex-direction: column; }
      .player-col { flex: 0 0 auto; padding: 12px; }
      .lyrics-col { flex: 1; min-height: 0; padding: 20px 16px; }
    }
  </style>
</head>
<body>
<div id="app">

  <div id="screen-input" class="screen active">
    <div class="input-wrap">
    <h1 class="app-title">Karaoke <span>学習</span></h1>
    <p class="app-subtitle">Paste a YouTube link and lyrics to start learning</p>

    <div id="apikey-prompt" class="field-group" style="display:none">
      <label class="field-label">Anthropic API Key</label>
      <input type="password" id="input-apikey" placeholder="sk-ant-…">
      <p class="field-hint">Stored locally in your browser. Never sent anywhere except Anthropic.</p>
      <div class="inline-error" id="apikey-error" style="display:none"></div>
    </div>

    <div class="field-group">
      <label class="field-label" for="input-url">YouTube URL</label>
      <input type="text" id="input-url" placeholder="https://www.youtube.com/watch?v=…">
    </div>

    <div class="field-group">
      <label class="field-label" for="input-language">Target Language</label>
      <select id="input-language">
        <option value="">Select a language…</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="Japanese">Japanese</option>
        <option value="Mandarin">Mandarin</option>
        <option value="Korean">Korean</option>
        <option value="Portuguese">Portuguese</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label" for="input-lyrics">Lyrics</label>
      <textarea id="input-lyrics" rows="10" placeholder="Paste one lyric line per row…"></textarea>
    </div>

    <div class="inline-error" id="input-error" style="display:none"></div>

    <button class="primary" id="btn-start">Translate &amp; Play →</button>
  </div>
  </div>

  <div id="screen-loading" class="screen">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <p id="loading-msg">Translating lyrics…</p>
      <p id="loading-sub"></p>
      <button class="secondary" id="btn-cancel" style="margin-top:24px">Cancel</button>
    </div>
  </div>

  <div id="screen-player" class="screen">
    <div class="player-col">
      <div style="width:100%;display:flex;justify-content:flex-start;margin-bottom:12px">
        <button class="secondary" onclick="location.reload()" style="font-size:12px;padding:6px 12px">← New song</button>
      </div>
      <div id="yt-player-wrap">
        <div id="yt-player"></div>
      </div>
    </div>
    <div class="lyrics-col" id="lyrics-panel">
    </div>
  </div>

  <div id="modal-recap" style="display:none">
    <div class="recap-card">
      <h2 id="recap-title"></h2>
      <div id="recap-grid" class="recap-grid"></div>
      <div class="recap-actions">
        <button class="secondary" id="btn-recap-close">Close</button>
        <button class="primary" id="btn-recap-replay">Watch Again</button>
      </div>
    </div>
  </div>

  <div id="tooltip" role="tooltip" style="display:none">
    <div class="tooltip-word" id="tooltip-word"></div>
    <div class="tooltip-meaning" id="tooltip-meaning"></div>
  </div>

</div>
<script>
// ── APP STATE ─────────────────────────────────────────────────────────────────
const APP = {
  apiKey: null,
  lyrics: [],          // [{original, translation, phonetic, keywords:[{word,meaning}]}]
  timestamps: [],      // [seconds per line]
  currentLine: -1,
  language: '',
  player: null,
  pollInterval: null,
  durationRetries: 0,
};

// ── SCREEN TRANSITIONS ────────────────────────────────────────────────────────
function showScreen(id) {
  const target = document.getElementById(id);
  if (!target) { console.error('showScreen: no element with id', id); return; }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  target.classList.add('active');
}

// ── UTILITIES ─────────────────────────────────────────────────────────────────
function extractVideoId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/?|youtube\.com\/shorts\/)([^&\n?#]{11})/);
  return m ? m[1] : null;
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError(id) { document.getElementById(id).style.display = 'none'; }

// ── API KEY GATE ──────────────────────────────────────────────────────────────
function initApiKey() {
  APP.apiKey = localStorage.getItem('anthropic_api_key');
  if (!APP.apiKey) {
    document.getElementById('apikey-prompt').style.display = 'flex';
  }
}

function getOrSaveApiKey() {
  if (APP.apiKey) return APP.apiKey;
  const val = document.getElementById('input-apikey').value.trim();
  if (!val) {
    showError('apikey-error', 'Please enter your Anthropic API key.');
    return null;
  }
  if (!val.startsWith('sk-ant-')) {
    showError('apikey-error', "That doesn't look like an Anthropic API key (should start with sk-ant-).");
    return null;
  }
  localStorage.setItem('anthropic_api_key', val);
  APP.apiKey = val;
  return val;
}

// ── START BUTTON ──────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', async () => {
  clearError('input-error');
  clearError('apikey-error');

  const key = getOrSaveApiKey();
  if (!key) return;

  const url = document.getElementById('input-url').value.trim();
  const language = document.getElementById('input-language').value;
  const rawLyrics = document.getElementById('input-lyrics').value;

  if (!extractVideoId(url)) {
    showError('input-error', 'Could not find a YouTube video ID in that URL.');
    return;
  }
  if (!language) {
    showError('input-error', 'Please select a target language.');
    return;
  }
  const lines = rawLyrics.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) {
    showError('input-error', 'Please paste at least 2 lyric lines.');
    return;
  }

  APP.language = language;
  await startTranslation(lines, url);
});

// ── TRANSLATION PIPELINE ──────────────────────────────────────────────────────
async function startTranslation(lines, youtubeUrl) {
  showScreen('screen-loading');
  document.getElementById('loading-msg').textContent = `Translating ${lines.length} lines…`;
  document.getElementById('loading-sub').textContent = 'This takes a few seconds';

  document.getElementById('btn-cancel').onclick = () => {
    showScreen('screen-input');
  };

  let lyrics;
  try {
    lyrics = await translateLyrics(lines, APP.language, APP.apiKey);
  } catch (err) {
    showScreen('screen-input');
    if (err.status === 401) {
      localStorage.removeItem('anthropic_api_key');
      APP.apiKey = null;
      document.getElementById('apikey-prompt').style.display = 'flex';
      showError('apikey-error', 'Invalid API key. Please re-enter it.');
    } else {
      showError('input-error', `Translation failed: ${err.message}`);
    }
    return;
  }

  APP.lyrics = lyrics;
  initPlayer(extractVideoId(youtubeUrl));
}

async function translateLyrics(lines, language, apiKey) {
  const prompt = `You are a language tutor. The user is learning ${language}. Translate the following ${language} song lyrics and provide phonetic guides and key vocabulary.

Return ONLY a JSON array with exactly ${lines.length} objects — one per input line — in this exact shape:
[{"original":"...","translation":"...","phonetic":"...","keywords":[{"word":"...","meaning":"..."}]}]

Rules:
- "phonetic": natural romanization for the language (pinyin for Mandarin, romaji for Japanese, Revised Romanization for Korean, loose phonetics for others)
- "keywords": 3–6 notable vocabulary words per line, chosen for learning value
- Return ONLY the raw JSON array. No markdown fences, no explanation text.

Lyrics (${lines.length} lines):
${lines.map((l, i) => `${i + 1}. ${l}`).join('\n')}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 4096,
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!res.ok) {
    const err = new Error(`API error ${res.status}`);
    err.status = res.status;
    throw err;
  }

  const data = await res.json();
  const text = data.content[0].text.trim();

  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    // Claude returned something wrapped — try to extract JSON array
    const match = text.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('Could not parse translation response as JSON.');
    parsed = JSON.parse(match[0]);
  }

  // Ensure every line has an entry; fall back gracefully for missing ones
  return lines.map((original, i) => parsed[i] ?? { original, translation: '', phonetic: '', keywords: [] });
}

// ── YOUTUBE PLAYER ────────────────────────────────────────────────────────────
let ytApiReady = false;
let pendingVideoId = null;

window.onYouTubeIframeAPIReady = function() {
  ytApiReady = true;
  if (pendingVideoId) createPlayer(pendingVideoId);
};

function initPlayer(videoId) {
  APP.durationRetries = 0;
  showScreen('screen-player');
  renderLyrics();
  if (ytApiReady) {
    createPlayer(videoId);
  } else {
    pendingVideoId = videoId;
  }
}

function createPlayer(videoId) {
  pendingVideoId = null;
  APP.player = new YT.Player('yt-player', {
    videoId,
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange,
    },
  });
}

function onPlayerReady() {
  waitForDuration();
}

function waitForDuration() {
  const dur = APP.player.getDuration();
  if (dur > 0) {
    assignTimestamps(dur);
    startPolling();
    return;
  }
  if (APP.durationRetries++ < 10) {
    setTimeout(waitForDuration, 500);
  } else {
    assignTimestamps(180);
    startPolling();
  }
}

function onPlayerStateChange(e) {
  if (e.data === YT.PlayerState.ENDED) showRecap();
}

// ── STUBS FOR LATER TASKS ─────────────────────────────────────────────────────
function renderLyrics() {
  const panel = document.getElementById('lyrics-panel');
  panel.innerHTML = '';
  APP.lyrics.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'lyric-line upcoming';
    div.dataset.index = i;

    // Original — words wrapped for tap-to-translate
    const origEl = document.createElement('div');
    origEl.className = 'lyric-original';
    origEl.innerHTML = line.original
      .split(/(\s+)/)
      .map(chunk => /\s/.test(chunk)
        ? chunk
        : `<span class="word" data-line="${i}">${chunk}</span>`)
      .join('');

    const phonEl = document.createElement('div');
    phonEl.className = 'lyric-phonetic';
    phonEl.textContent = line.phonetic;

    const transEl = document.createElement('div');
    transEl.className = 'lyric-translation';
    transEl.textContent = line.translation;

    div.append(origEl, phonEl, transEl);
    panel.appendChild(div);
  });
}
function assignTimestamps(duration) {
  const count = APP.lyrics.length;
  APP.timestamps = APP.lyrics.map((_, i) => (i / count) * duration);
}

function currentLineFor(currentTime) {
  let idx = 0;
  for (let i = 0; i < APP.timestamps.length; i++) {
    if (APP.timestamps[i] <= currentTime) idx = i;
    else break;
  }
  return idx;
}

function startPolling() {
  if (APP.pollInterval) clearInterval(APP.pollInterval);
  APP.pollInterval = setInterval(() => {
    if (!APP.player || typeof APP.player.getCurrentTime !== 'function') return;
    const t = APP.player.getCurrentTime();
    const next = currentLineFor(t);
    if (next !== APP.currentLine) {
      updateCurrentLine(next);
    }
  }, 500);
}

function updateCurrentLine(index) {
  APP.currentLine = index;
  const panel = document.getElementById('lyrics-panel');
  const lines = panel.querySelectorAll('.lyric-line');

  lines.forEach((el, i) => {
    el.classList.remove('current', 'past', 'upcoming');
    if (i < index) el.classList.add('past');
    else if (i === index) el.classList.add('current');
    else el.classList.add('upcoming');
  });

  // Scroll current line into center of panel
  const currentEl = lines[index];
  if (currentEl) {
    currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function showRecap() {
  const allKeywords = uniqueKeywords(APP.lyrics);

  document.getElementById('recap-title').innerHTML =
    `You learned <span>${allKeywords.length} words</span> in ${APP.language}!`;

  const grid = document.getElementById('recap-grid');
  grid.innerHTML = '';
  allKeywords.forEach(kw => {
    const card = document.createElement('div');
    card.className = 'recap-kw';
    card.innerHTML = `<div class="recap-kw-word">${kw.word}</div><div class="recap-kw-meaning">${kw.meaning}</div>`;
    grid.appendChild(card);
  });

  document.getElementById('modal-recap').style.display = 'flex';
}

function uniqueKeywords(lyrics) {
  const seen = new Set();
  const result = [];
  for (const line of lyrics) {
    for (const kw of line.keywords) {
      const key = kw.word.toLowerCase();
      if (!seen.has(key)) {
        seen.add(key);
        result.push(kw);
      }
    }
  }
  return result;
}

document.getElementById('btn-recap-close').addEventListener('click', () => {
  document.getElementById('modal-recap').style.display = 'none';
});

document.getElementById('btn-recap-replay').addEventListener('click', () => {
  document.getElementById('modal-recap').style.display = 'none';
  APP.currentLine = -1;
  APP.player.seekTo(0);
  APP.player.playVideo();
});

// ── TAP-TO-TRANSLATE ──────────────────────────────────────────────────────────
let tooltipTimer = null;

document.getElementById('lyrics-panel').addEventListener('click', e => {
  const wordEl = e.target.closest('.word');
  if (!wordEl) return;

  const lineIndex = parseInt(wordEl.dataset.line, 10);
  if (lineIndex !== APP.currentLine) return; // only current line

  const word = wordEl.textContent.trim().replace(/[.,!?;:'"…—]/g, '');
  const lineData = APP.lyrics[lineIndex];
  const kw = lineData?.keywords?.find(
    k => k.word.toLowerCase() === word.toLowerCase()
  );

  const tooltip = document.getElementById('tooltip');
  document.getElementById('tooltip-word').textContent = word;
  document.getElementById('tooltip-meaning').textContent =
    kw ? kw.meaning : 'No translation available';

  // Position tooltip near word
  const rect = wordEl.getBoundingClientRect();
  tooltip.style.display = 'block';
  const ttW = 240;
  const ttH = tooltip.offsetHeight;
  let left = rect.left;
  if (left + ttW > window.innerWidth - 8) left = window.innerWidth - ttW - 8;
  const top = (rect.bottom + 6 + ttH > window.innerHeight - 8)
    ? rect.top - ttH - 6
    : rect.bottom + 6;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;

  // Auto-dismiss after 3s
  clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(hideTooltip, 3000);
});

document.addEventListener('mousedown', e => {
  if (!e.target.closest('.word')) hideTooltip();
});

function hideTooltip() {
  clearTimeout(tooltipTimer);
  document.getElementById('tooltip').style.display = 'none';
}

// Run on load
initApiKey();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
